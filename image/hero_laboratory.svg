<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 590" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#d6eaf1"/><stop offset=".58" stop-color="#e4f1f5"/><stop offset="1" stop-color="#c2dce6"/></linearGradient>
  <linearGradient id="window" x2=".95" y2="1"><stop stop-color="#f2f9fb"/><stop offset="1" stop-color="#cfecf5"/></linearGradient>
  <linearGradient id="bench" x2="0" y2="1"><stop stop-color="#eff8fb"/><stop offset="1" stop-color="#aacbd6"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#f7fdff" stop-opacity=".86"/><stop offset=".66" stop-color="#c9e9f5" stop-opacity=".66"/><stop offset="1" stop-color="#92cae0" stop-opacity=".66"/></linearGradient>
  <linearGradient id="sample" x2="0" y2="1"><stop stop-color="#64c5e2" stop-opacity=".45"/><stop offset="1" stop-color="#279ace" stop-opacity=".7"/></linearGradient>
  <linearGradient id="instrument" x2="0" y2="1"><stop stop-color="#eef7fa"/><stop offset="1" stop-color="#a3bec9"/></linearGradient>
  <filter id="shadow" x="-.25" y="-.25" width="1.5" height="1.7"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="grain" patternUnits="userSpaceOnUse" width="27" height="27"><circle cx="2" cy="4" r=".55" fill="#87b6c7" opacity=".18"/><circle cx="22" cy="12" r=".65" fill="#fff" opacity=".7"/></pattern>
</defs>
